<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="520" height="180">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
      .font-8bit {
        font-family: 'Press Start 2P', monospace, sans-serif;
        font-smooth: never;
        -webkit-font-smoothing: none;
        image-rendering: pixelated;
      }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Dark Gaming Backdrop Simulation -->
  <rect width="100%" height="100%" fill="#07090e" rx="12"/>
  
  <!-- Outer Card (Pure Black with 2px White Border, 18px Rounded Radius) -->
  <rect x="25" y="45" width="470" height="90" rx="18" fill="#000000" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)"/>

  <!-- Left Pod: Clock Pod (Deep Charcoal with 1px border, 12px Rounded Radius) -->
  <rect x="37" y="57" width="245" height="66" rx="12" fill="#141414" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.7"/>

  <!-- Blinking Arrow Cursor ► -->
  <polygon points="56,84 56,98 67,91" fill="#ffffff"/>

  <!-- Main Time (10:45) -->
  <text x="78" y="96" class="font-8bit" font-size="18" font-weight="bold" fill="#ffffff" letter-spacing="1">10:45</text>
  
  <!-- AM/PM indicator -->
  <text x="210" y="95" class="font-8bit" font-size="11" fill="#888888">PM</text>

  <!-- Right Pod: Session Duration -->
  <text x="315" y="80" class="font-8bit" font-size="9" fill="#888888" letter-spacing="1.5">SESSION</text>
  <text x="315" y="104" class="font-8bit" font-size="15" font-weight="bold" fill="#ffffff" letter-spacing="1">01H 30M</text>

  <!-- Live Status Tag -->
  <circle cx="455" cy="76" r="3" fill="#ffffff"/>
  <text x="440" y="104" class="font-8bit" font-size="8" fill="#555555" text-anchor="middle">LIVE</text>
</svg>
