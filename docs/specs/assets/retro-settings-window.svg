<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
      .font-8bit {
        font-family: 'Press Start 2P', monospace, sans-serif;
        font-smooth: never;
        -webkit-font-smoothing: none;
        image-rendering: pixelated;
      }
    </style>
  </defs>

  <!-- Dark Background -->
  <rect width="100%" height="100%" fill="#07090e" rx="12"/>

  <!-- Main Window Frame (Pure Black, 3px White Border, 16px Rounded) -->
  <rect x="25" y="20" width="470" height="300" rx="16" fill="#000000" stroke="#ffffff" stroke-width="3"/>

  <!-- Titlebar -->
  <text x="45" y="52" class="font-8bit" font-size="12" fill="#ffffff">► TIME REMINDER CONFIG</text>
  <text x="460" y="52" class="font-8bit" font-size="10" fill="#888888">[X]</text>
  <line x1="25" y1="65" x2="495" y2="65" stroke="#ffffff" stroke-width="2"/>

  <!-- Section 1: Interval -->
  <text x="45" y="92" class="font-8bit" font-size="8" fill="#888888">INTERVAL:</text>
  <rect x="45" y="102" width="95" height="30" rx="6" fill="#141414" stroke="#444444" stroke-width="1"/>
  <text x="92" y="122" class="font-8bit" font-size="8" fill="#888888" text-anchor="middle">15M</text>

  <rect x="150" y="102" width="95" height="30" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
  <text x="197" y="122" class="font-8bit" font-size="8" fill="#000000" font-weight="bold" text-anchor="middle">30M ✓</text>

  <rect x="255" y="102" width="95" height="30" rx="6" fill="#141414" stroke="#444444" stroke-width="1"/>
  <text x="302" y="122" class="font-8bit" font-size="8" fill="#888888" text-anchor="middle">45M</text>

  <rect x="360" y="102" width="95" height="30" rx="6" fill="#141414" stroke="#444444" stroke-width="1"/>
  <text x="407" y="122" class="font-8bit" font-size="8" fill="#888888" text-anchor="middle">60M</text>

  <!-- Section 2: Position -->
  <text x="45" y="160" class="font-8bit" font-size="8" fill="#888888">SCREEN POSITION:</text>
  <rect x="45" y="170" width="130" height="30" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
  <text x="110" y="190" class="font-8bit" font-size="8" fill="#000000" font-weight="bold" text-anchor="middle">TOP-RIGHT</text>

  <rect x="185" y="170" width="130" height="30" rx="6" fill="#141414" stroke="#444444" stroke-width="1"/>
  <text x="250" y="190" class="font-8bit" font-size="8" fill="#888888" text-anchor="middle">TOP-CENTER</text>

  <rect x="325" y="170" width="130" height="30" rx="6" fill="#141414" stroke="#444444" stroke-width="1"/>
  <text x="390" y="190" class="font-8bit" font-size="8" fill="#888888" text-anchor="middle">TOP-LEFT</text>

  <!-- Section 3: Clock Format -->
  <text x="45" y="228" class="font-8bit" font-size="8" fill="#888888">FORMAT:</text>
  <rect x="45" y="238" width="195" height="30" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
  <text x="142" y="258" class="font-8bit" font-size="8" fill="#000000" font-weight="bold" text-anchor="middle">12-HOUR (AM/PM)</text>

  <rect x="250" y="238" width="205" height="30" rx="6" fill="#141414" stroke="#444444" stroke-width="1"/>
  <text x="352" y="258" class="font-8bit" font-size="8" fill="#888888" text-anchor="middle">24-HOUR (MILITARY)</text>

  <!-- Bottom Action Buttons -->
  <line x1="25" y1="285" x2="495" y2="285" stroke="#222222" stroke-width="1"/>
  <rect x="330" y="293" width="145" height="22" rx="4" fill="#ffffff"/>
  <text x="402" y="308" class="font-8bit" font-size="7" fill="#000000" font-weight="bold" text-anchor="middle">SAVE CONFIG</text>
</svg>
