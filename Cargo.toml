[package]
name = "time-reminder"
version = "0.1.0"
edition = "2021"

[lib]
name = "time_reminder"
path = "src/lib.rs"

[[bin]]
name = "time-reminder"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_Registry",
]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

